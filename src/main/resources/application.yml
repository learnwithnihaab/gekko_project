spring:
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/gekko}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:ChangeMe}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

# redis (if used)
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

# Outbox config
outbox:
  poll:
    delay: 5000
  batch:
    size: 50
  retry:
    count: 3
