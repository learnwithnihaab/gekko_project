name: Apply Gekko project files

on:
  workflow_dispatch:

jobs:
  add-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create project files and commit to new branch
        run: |
          set -euo pipefail
          BRANCH=feature/complete-project-3

          # Configure git user for the commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create and switch to branch
          if git show-ref --quiet refs/heads/$BRANCH; then
            git switch $BRANCH
          else
            git switch -c $BRANCH
          fi

          # Create directories
          mkdir -p src/main/java/com/gekko/controller
          mkdir -p src/main/java/com/gekko/service
          mkdir -p src/main/java/com/gekko/security
          mkdir -p src/main/resources/db/migration
          mkdir -p src/main/resources
          mkdir -p .github/workflows

          # README
          cat > README.md <<'EOF'
# Gekko Project - Starter implementation

This branch adds a starter Spring Boot backend skeleton for the Gekko subscription management project.

What's included (summary):
- Java 11 + Spring Boot starter project (pom.xml)
- Basic controllers and services (examples)
- application.yml (development defaults)
- Flyway V1 migration to create a basic table
- docker-compose.yml (postgres, zookeeper, kafka, redis)
- CI workflow (.github/workflows/ci.yml)
- This apply workflow (creates branch + PR)

How to use:
1. Start local infra:
   docker-compose up -d
2. Build and run:
   mvn clean package
   java -jar target/gekko-service-0.0.1-SNAPSHOT.jar
3. Endpoints:
   - GET /api/v1/health (sample)
   - See src/ for sample controllers.

Notes:
- This is a starter skeleton: replace the stubbed/simplified classes with production implementations,
  add real PDAPI/BRIM clients, secure secrets and update JWT/OAuth config as needed.
EOF

          # pom.xml (minimal)
          cat > pom.xml <<'EOF'
<project xmlns="http://maven.apache.org/POM/4.0.0" 
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 
         http://maven.apache.org/xsd/maven-4.0.0.xsd">
  <modelVersion>4.0.0</modelVersion>
  <groupId>com.gekko</groupId>
  <artifactId>gekko-service</artifactId>
  <version>0.0.1-SNAPSHOT</version>
  <packaging>jar</packaging>

  <properties>
    <java.version>11</java.version>
    <spring.boot.version>2.7.12</spring.boot.version>
    <lombok.version>1.18.28</lombok.version>
  </properties>

  <dependencies>
    <dependency>
      <groupId>org.springframework.boot</groupId>
      <artifactId>spring-boot-starter-web</artifactId>
    </dependency>
    <dependency>
      <groupId>org.springframework.boot</groupId>
      <artifactId>spring-boot-starter-data-jpa</artifactId>
    </dependency>
    <dependency>
      <groupId>org.postgresql</groupId>
      <artifactId>postgresql</artifactId>
      <scope>runtime</scope>
    </dependency>
    <dependency>
      <groupId>org.flywaydb</groupId>
      <artifactId>flyway-core</artifactId>
    </dependency>
    <dependency>
      <groupId>org.projectlombok</groupId>
      <artifactId>lombok</artifactId>
      <version>${lombok.version}</version>
      <scope>provided</scope>
    </dependency>
    <dependency>
      <groupId>org.springframework.boot</groupId>
      <artifactId>spring-boot-starter-test</artifactId>
      <scope>test</scope>
    </dependency>
  </dependencies>

  <build>
    <plugins>
      <plugin>
        <groupId>org.springframework.boot</groupId>
        <artifactId>spring-boot-maven-plugin</artifactId>
      </plugin>
    </plugins>
  </build>
</project>
EOF

          # application.yml (development config)
          cat > src/main/resources/application.yml <<'EOF'
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gekko
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
app:
  jwt:
    secret: ChangeMe
EOF

          # docker-compose.yml
          cat > docker-compose.yml <<'EOF'
version: '3.8'
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: gekko
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
EOF

          # Flyway V1 migration
          cat > src/main/resources/db/migration/V1__init.sql <<'EOF'
CREATE TABLE customers (
  id bigserial PRIMARY KEY,
  name varchar(255) NOT NULL,
  email varchar(255) UNIQUE
);
EOF

          # Minimal Spring Boot application
          cat > src/main/java/com/gekko/GekkoApplication.java <<'EOF'
package com.gekko;

import org.springframework.boot.SpringApplication;
import org.springframework.boot.autoconfigure.SpringBootApplication;

@SpringBootApplication
public class GekkoApplication {
  public static void main(String[] args) {
    SpringApplication.run(GekkoApplication.class, args);
  }
}
EOF

          # Sample controller
          cat > src/main/java/com/gekko/controller/OrderController.java <<'EOF'
package com.gekko.controller;

import org.springframework.http.ResponseEntity;
import org.springframework.web.bind.annotation.GetMapping;
import org.springframework.web.bind.annotation.RestController;

/**
 * Sample controller (starter).
 */
@RestController
public class OrderController {

  @GetMapping("/api/v1/health")
  public ResponseEntity<String> health() {
    return ResponseEntity.ok("ok");
  }
}
EOF

          # Simple security stub (disable for starter)
          cat > src/main/java/com/gekko/security/SecurityConfig.java <<'EOF'
package com.gekko.security;

import org.springframework.context.annotation.Configuration;
import org.springframework.security.config.annotation.web.builders.HttpSecurity;
import org.springframework.security.config.annotation.web.configuration.WebSecurityConfigurerAdapter;

/**
 * Security config: left permissive for the starter project.
 * Replace with JWT / OAuth2 in production.
 */
@SuppressWarnings("deprecation")
@Configuration
public class SecurityConfig extends WebSecurityConfigurerAdapter {
  @Override
  protected void configure(HttpSecurity http) throws Exception {
    http.csrf().disable().authorizeRequests().anyRequest().permitAll();
  }
}
EOF

          # Add a minimal CI workflow (runs mvn test)
          cat > .github/workflows/ci.yml <<'EOF'
name: CI

on:
  push:
    branches:
      - main
      - feature/** 
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build and test
        run: mvn -B -DskipTests=false test
EOF

          # Stage and commit changes
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Gekko starter project skeleton (README, pom, config, basic sources, migration, docker-compose, CI)"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add Gekko starter project skeleton"
          branch: feature/complete-project-3
          title: "Feature: add Gekko starter project skeleton"
          body: |
            This PR adds a starter Spring Boot skeleton for the Gekko project:
            - pom.xml, README.md
            - application.yml, Flyway migration V1__init.sql
            - docker-compose.yml (postgres, zookeeper, kafka)
            - basic Java application and sample controller
            - CI workflow (runs mvn test)
