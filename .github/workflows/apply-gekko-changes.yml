name: Apply Gekko project files

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  add-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Gekko project files
        run: |
          set -euo pipefail

          # Create directories
          mkdir -p src/main/java/com/gekko/controller
          mkdir -p src/main/java/com/gekko/service
          mkdir -p src/main/java/com/gekko/security
          mkdir -p src/main/resources/db/migration
          mkdir -p src/main/resources

          # README
          cat > README.md <<'EOF'
          # Gekko Project

          Gekko Subscription Management Project.

          ## Current Implementation

          - Java 11
          - Spring Boot
          - Spring Security
          - Spring Data JPA
          - PostgreSQL
          - Flyway
          - Kafka
          - Redis
          - Docker Compose

          ## Run locally

          ```bash
          docker compose up -d
          mvn clean package
          mvn spring-boot:run
          ```

          ## Health Endpoint

          GET /api/v1/health
          EOF

          # pom.xml
          cat > pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">

              <modelVersion>4.0.0</modelVersion>

              <parent>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-starter-parent</artifactId>
                  <version>2.7.18</version>
                  <relativePath/>
              </parent>

              <groupId>com.gekko</groupId>
              <artifactId>gekko-service</artifactId>
              <version>0.0.1-SNAPSHOT</version>

              <name>gekko-service</name>
              <description>Gekko Subscription Management Service</description>

              <properties>
                  <java.version>11</java.version>
              </properties>

              <dependencies>

                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-web</artifactId>
                  </dependency>

                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-security</artifactId>
                  </dependency>

                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-data-jpa</artifactId>
                  </dependency>

                  <dependency>
                      <groupId>org.postgresql</groupId>
                      <artifactId>postgresql</artifactId>
                      <scope>runtime</scope>
                  </dependency>

                  <dependency>
                      <groupId>org.flywaydb</groupId>
                      <artifactId>flyway-core</artifactId>
                  </dependency>

                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-test</artifactId>
                      <scope>test</scope>
                  </dependency>

              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.springframework.boot</groupId>
                          <artifactId>spring-boot-maven-plugin</artifactId>
                      </plugin>
                  </plugins>
              </build>

          </project>
          EOF

          # application.yml
          cat > src/main/resources/application.yml <<'EOF'
          spring:
            datasource:
              url: jdbc:postgresql://localhost:5432/gekko
              username: postgres
              password: password

            jpa:
              hibernate:
                ddl-auto: validate
              show-sql: true

            flyway:
              enabled: true

          server:
            port: 8080
          EOF

          # Docker Compose
          cat > docker-compose.yml <<'EOF'
          services:

            postgres:
              image: postgres:13
              container_name: gekko-postgres
              environment:
                POSTGRES_DB: gekko
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: password
              ports:
                - "5432:5432"
              volumes:
                - postgres-data:/var/lib/postgresql/data

            zookeeper:
              image: confluentinc/cp-zookeeper:7.0.1
              container_name: gekko-zookeeper
              environment:
                ZOOKEEPER_CLIENT_PORT: 2181
                ZOOKEEPER_TICK_TIME: 2000
              ports:
                - "2181:2181"

            kafka:
              image: confluentinc/cp-kafka:7.0.1
              container_name: gekko-kafka
              depends_on:
                - zookeeper
              ports:
                - "9092:9092"
              environment:
                KAFKA_BROKER_ID: 1
                KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
                KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
                KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

            redis:
              image: redis:7
              container_name: gekko-redis
              ports:
                - "6379:6379"

          volumes:
            postgres-data:
          EOF

          # Flyway migration
          cat > src/main/resources/db/migration/V1__init.sql <<'EOF'
          CREATE TABLE customers (
              id BIGSERIAL PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              email VARCHAR(255) UNIQUE
          );
          EOF

          # Main Spring Boot application
          cat > src/main/java/com/gekko/GekkoApplication.java <<'EOF'
          package com.gekko;

          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;

          @SpringBootApplication
          public class GekkoApplication {

              public static void main(String[] args) {
                  SpringApplication.run(GekkoApplication.class, args);
              }
          }
          EOF

          # Health controller
          cat > src/main/java/com/gekko/controller/OrderController.java <<'EOF'
          package com.gekko.controller;

          import org.springframework.http.ResponseEntity;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;

          @RestController
          public class OrderController {

              @GetMapping("/api/v1/health")
              public ResponseEntity<String> health() {
                  return ResponseEntity.ok("ok");
              }
          }
          EOF

          # Security configuration
          cat > src/main/java/com/gekko/security/SecurityConfig.java <<'EOF'
          package com.gekko.security;

          import org.springframework.context.annotation.Configuration;
          import org.springframework.security.config.annotation.web.builders.HttpSecurity;
          import org.springframework.security.config.annotation.web.configuration.EnableWebSecurity;
          import org.springframework.security.config.annotation.web.configuration.WebSecurityConfigurerAdapter;

          @Configuration
          @EnableWebSecurity
          @SuppressWarnings("deprecation")
          public class SecurityConfig extends WebSecurityConfigurerAdapter {

              @Override
              protected void configure(HttpSecurity http) throws Exception {
                  http
                      .csrf()
                      .disable()
                      .authorizeRequests()
                      .anyRequest()
                      .permitAll();
              }
          }
          EOF

          echo "Gekko project files created successfully."

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: feature/complete-project-3
          base: main
          delete-branch: false
          title: "Feature: add Gekko starter project"
          commit-message: "Add Gekko starter project"
          body: |
            ## Gekko Project

            This PR adds the initial Gekko Spring Boot project structure.

            ### Included

            - Maven configuration
            - Spring Boot application
            - Spring Security configuration
            - PostgreSQL configuration
            - Flyway migration
            - Docker Compose
            - Health endpoint

            Further production implementation can be added in subsequent commits.
